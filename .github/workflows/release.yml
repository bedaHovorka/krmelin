name: Release

on:
  push:
    tags: ["v*"]
  # Lets a failed release be re-run without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Locate the fat jar
        id: jar
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name 'krmelin-*.jar' ! -name '*-slim.jar')
          if [ -z "$jar_file" ] || [ "$(printf '%s\n' "$jar_file" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one shadow jar in build/libs, found:"; printf '%s\n' "$jar_file"; exit 1
          fi
          echo "path=$jar_file" >> "$GITHUB_OUTPUT"

      - name: Verify the jar reports the tagged version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          actual=$(java -jar "${{ steps.jar.outputs.path }}" --version | awk '{print $NF}')
          if [ "$actual" != "$expected" ]; then
            echo "Tag $tag expects version $expected, but the jar reports $actual."
            echo "Bump 'version' in build.gradle.kts to match the tag."
            exit 1
          fi
          echo "Version check OK: $actual"

      - name: Extract this version's changelog section
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # Everything between this version's heading and the next '## ' heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for [$version]." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Idempotent: re-running the same tag updates the release instead of failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" "${{ steps.jar.outputs.path }}" --clobber
